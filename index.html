<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,650&display=swap" rel="stylesheet">
<title>Bimbingan Karya Ilmiah</title>
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--text:#0c1b33;--muted:#5d6b82;--line:#e1e6ee;--fill:#edf1f6;
  --navy:#0b1d3f;--navy2:#143272;--accent:#1f58d8;--btn:#1f58d8;
  --gold:#d6a43a;--gold-ink:#7a5710;--gold-l:#f6ead0;
  --green:#12805c;--amber:#b45f06;--red:#c62828;--violet:#6d4bd1;--teal:#0e7c86;
  --glass:rgba(255,255,255,.84);
  --shadow:0 1px 2px rgba(12,27,51,.05),0 12px 30px -14px rgba(12,27,51,.18);
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
}
@media(prefers-color-scheme:dark){:root{--bg:#07101f;--card:#0f1b31;--text:#e7edf8;--muted:#93a2bb;--line:#1c2a46;--fill:#15233e;--navy:#0a1a38;--navy2:#123069;--accent:#79a2ff;--btn:#2f66e8;--gold:#e2b247;--gold-ink:#f0cd78;--gold-l:#3a2f12;--green:#34c38f;--amber:#f0a43a;--red:#f26d6d;--violet:#a58cff;--teal:#3fc1cb;--glass:rgba(15,27,49,.84);--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 30px -14px rgba(0,0,0,.7)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:600;line-height:1.18}
h1,h2{font-family:var(--serif);letter-spacing:-.012em}
h1{font-size:clamp(1.6rem,4.6vw,2.15rem)}h2{font-size:1.28rem}h3{font-size:1.02rem;letter-spacing:-.005em}
small,.muted{color:var(--muted)}small{font-size:.8125rem}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px 96px}
.pg{padding:30px 2px 6px}.pg p{margin:6px 0 0;color:var(--muted);max-width:60ch}

/* top bar */
header.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-bottom:1px solid var(--line)}
header.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.brand .lg{width:36px;height:36px;border-radius:10px;background:linear-gradient(145deg,var(--navy2),var(--navy));color:var(--gold);display:grid;place-items:center;flex:none;box-shadow:0 2px 8px -2px rgba(11,29,63,.5)}
.brand .lg svg{width:21px;height:21px}
.brand .bt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.brand .bt b{font-family:var(--serif);font-weight:650;font-size:1.02rem;letter-spacing:-.01em;white-space:nowrap}
.brand .bt small{font-size:.72rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:8px 14px;border-radius:999px;color:var(--muted);cursor:pointer;font-size:.9rem;font-weight:550;transition:background .15s,color .15s}
.nav button:hover{background:var(--fill);color:var(--text)}
.nav button.on{background:var(--navy);color:#fff}
@media(prefers-color-scheme:dark){.nav button.on{background:var(--fill);color:var(--text)}}
.uchip{display:flex;align-items:center;gap:8px;font-size:.88rem;font-weight:550}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:.78rem;background:hsl(var(--h) 48% 40%);flex:none;letter-spacing:.02em}
.av.lg2{width:44px;height:44px;font-size:.92rem}

/* surfaces */
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:20px;margin-top:16px}
.hero2{margin-top:20px;border-radius:22px;padding:26px 26px 22px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,var(--navy2) 0%,var(--navy) 62%);box-shadow:0 18px 40px -22px rgba(11,29,63,.7);position:relative;overflow:hidden}
.hero2::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(214,164,58,.28);pointer-events:none}
.hero2 .hrow{display:flex;gap:22px;align-items:flex-start;justify-content:space-between}
.hero2 .hm{min-width:0;flex:1}
.hero2 .hm small{color:rgba(255,255,255,.72)}
.hero2 h1{font-size:clamp(1.25rem,3.4vw,1.75rem);line-height:1.25;margin:6px 0 4px;overflow-wrap:anywhere}
.hero2 .pc{text-align:right;flex:none}
.hero2 .pc b{display:block;font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,7vw,3.6rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.hero2 .pc small{color:rgba(255,255,255,.72)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.75rem;padding:3px 11px;border-radius:999px;background:var(--fill);color:var(--muted);font-weight:550}
.hero2 .chip{background:rgba(255,255,255,.14);color:#fff}
.hero2 .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
@media(max-width:560px){.hero2{padding:20px 18px 18px;border-radius:18px}.hero2 .hrow{flex-direction:column;gap:12px}.hero2 .pc{text-align:left}}

/* jalur (milestone track) */
.jlw{overflow-x:auto;margin:20px -6px 0;padding:6px 6px 2px;scrollbar-width:thin}
.jl{list-style:none;margin:0;padding:0;display:flex;min-width:560px}
.jn{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0;padding:0 2px}
.jn b{font-size:.74rem;font-weight:600;color:var(--jlab);line-height:1.2}
.jn small{font-size:.68rem;color:var(--jsub);line-height:1}
.jd{width:24px;height:24px;border-radius:50%;z-index:1;display:grid;place-items:center;border:2px solid var(--jtodo);background:var(--jbg);color:var(--jbg);flex:none;transition:transform .2s}
.jn+.jn::before{content:"";position:absolute;top:calc(var(--jtop) - 1px);left:-50%;width:100%;height:3px;border-radius:2px;background:var(--jt);transform-origin:left}
.jn.done+.jn::before{background:var(--jf)}
.jn.done .jd{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.jn.cur .jd{background:var(--jcur);border-color:var(--jcur);box-shadow:0 0 0 5px var(--jhalo)}
.jn.cur .jd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--navy)}
.jn.todo b{opacity:.62}
.jn.acc .jd{border-radius:7px;transform:rotate(45deg);width:21px;height:21px;margin:1.5px 0}
.jn.acc .jd svg{transform:rotate(-45deg)}
.jn.acc.cur .jd::after{display:none}
.jn.acc.cur .jd{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 5px rgba(214,164,58,.3)}
.on-dark{--jt:rgba(255,255,255,.2);--jf:var(--gold);--jlab:#fff;--jsub:rgba(255,255,255,.7);--jtodo:rgba(255,255,255,.38);--jbg:var(--navy);--jcur:#fff;--jhalo:rgba(255,255,255,.2);--jtop:12px}
.on-light{--jt:var(--line);--jf:var(--accent);--jlab:var(--text);--jsub:var(--muted);--jtodo:var(--line);--jbg:var(--card);--jcur:var(--accent);--jhalo:color-mix(in srgb,var(--accent) 22%,transparent);--jtop:44px}
.on-light .jn.done .jd{background:var(--accent);border-color:var(--accent);color:#fff}
.on-light .jn.cur .jd::after{background:#fff}
.cb{height:26px;min-width:26px;padding:0 8px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:.8rem;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.cb.z{background:transparent;color:var(--muted);font-weight:500}
.cb.w{background:var(--amber)}
.jn.fin .cb:not(.z){background:var(--green)}
.play .jn+.jn::before{animation:jgrow .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*110ms)}
.play .jn .jd{animation:jpop .35s cubic-bezier(.2,.8,.3,1.3) both;animation-delay:calc(var(--i)*110ms)}
@keyframes jgrow{from{transform:scaleX(0)}}
@keyframes jpop{from{opacity:0;scale:.5}}

/* figures strip */
.strip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:16px}
.strip>div{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.strip>div:first-child{border-left:0}
.strip small{display:block}
.strip b{display:block;font-family:var(--serif);font-weight:600;font-size:2rem;letter-spacing:-.02em;line-height:1.15;margin-top:2px;font-variant-numeric:tabular-nums}
.strip em{font-style:normal;font-size:.75rem;color:var(--muted)}
@media(max-width:700px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-left:0}.strip>div:nth-child(n+3){border-top:1px solid var(--line)}}

/* next step */
.next{display:flex;gap:18px;align-items:center;justify-content:space-between;border-left:4px solid var(--accent)}
.next.rev{border-left-color:var(--amber)}.next.sub{border-left-color:var(--gold)}
.next h2{margin:2px 0 4px}.next p{margin:0}
.next .nb{display:flex;gap:8px;flex-wrap:wrap;flex:none}
@media(max-width:620px){.next{flex-direction:column;align-items:flex-start}}

/* buttons, forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:11px;padding:11px 18px;font-weight:600;cursor:pointer;background:var(--fill);transition:transform .1s ease-out,opacity .2s,background .15s;text-decoration:none;color:var(--text);min-height:44px}
.btn:hover{background:color-mix(in srgb,var(--fill) 70%,var(--line))}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.primary{background:var(--btn);color:#fff}.btn.primary:hover{background:color-mix(in srgb,var(--btn) 88%,#000)}
.btn.good{background:var(--green);color:#fff}
.btn.warn{background:var(--amber);color:#fff}
.btn.wa{background:#1f9d4d;color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.hero2 .btn{background:rgba(255,255,255,.14);color:#fff}.hero2 .btn:hover{background:rgba(255,255,255,.22)}
.hero2 .btn.wa{background:#1f9d4d}
.btn.sm{padding:7px 13px;min-height:34px;font-size:.875rem;border-radius:9px}
.btn.block{width:100%}
.lnk{background:none;border:0;color:var(--accent);padding:4px 0;cursor:pointer;text-align:left;font-size:.875rem;overflow-wrap:anywhere}
label.f{display:block;margin-top:14px;font-size:.8125rem;color:var(--muted);font-weight:550}
.inp{width:100%;margin-top:5px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:1rem;outline:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.inp{min-height:140px;resize:vertical;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.seg{display:inline-flex;background:var(--fill);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 15px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(12,27,51,.14)}
.card>.seg{display:flex;margin-bottom:6px}.card>.seg button{flex:1}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
.cap{display:flex;gap:10px;align-items:center;margin-top:5px}
.cap .q{font-weight:650;font-size:1.15rem;background:var(--fill);padding:10px 16px;border-radius:10px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* sign in */
.auth{display:grid;grid-template-columns:5fr 6fr;gap:22px;margin-top:26px;align-items:start}
.ap{border-radius:22px;padding:34px 30px;color:#fff;background:radial-gradient(130% 120% at 0% 0%,var(--navy2) 0%,var(--navy) 65%);position:sticky;top:84px;overflow:hidden}
.ap::after{content:"";position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;border-radius:50%;border:1px solid rgba(214,164,58,.3)}
.ap .lg{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.1);color:var(--gold);display:grid;place-items:center}
.ap .lg svg{width:26px;height:26px}
.ap h1{margin:18px 0 10px;font-size:clamp(1.55rem,3.6vw,2.05rem);color:#fff}
.ap p{margin:0;color:rgba(255,255,255,.78);max-width:42ch}
.ap ol{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:12px}
.ap li{display:flex;gap:12px;align-items:flex-start;color:rgba(255,255,255,.92);font-size:.93rem}
.ap li i{flex:none;width:22px;height:22px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;margin-top:1px}
.af .card{margin-top:0}
@media(max-width:820px){.auth{grid-template-columns:1fr}.ap{position:static;padding:24px 22px}.ap ol{display:none}}

/* timeline */
.grp{margin:26px 4px 8px;font-size:.8rem;color:var(--muted);font-weight:650;letter-spacing:.01em}
.stage{background:var(--card);border-radius:14px;margin-top:8px;border:1px solid var(--line);border-left-width:4px;overflow:hidden;transition:box-shadow .2s}
.stage:hover{box-shadow:var(--shadow)}
.stage.st-accepted{border-left-color:var(--green)}.stage.st-submitted{border-left-color:var(--gold)}.stage.st-revision{border-left-color:var(--amber)}.stage.st-open{border-left-color:var(--accent)}.stage.st-locked{border-left-color:var(--line)}
.stage.crucial{background:linear-gradient(90deg,var(--gold-l),var(--card) 38%)}
.srow{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:14px 16px;text-align:left;cursor:pointer;min-height:58px}
.sic{width:26px;height:26px;flex:none;color:var(--muted)}
.sic svg{width:100%;height:100%;display:block}
.stxt{flex:1;min-width:0;display:flex;flex-direction:column}
.stxt b{font-weight:600;overflow-wrap:anywhere}
.chev{color:var(--muted);transition:transform .25s cubic-bezier(.2,.8,.2,1);font-size:1.2rem}
.stage.openb .chev{transform:rotate(90deg)}
.st-accepted .sic{color:var(--green)}.st-submitted .sic{color:var(--gold-ink)}.st-revision .sic{color:var(--amber)}.st-open .sic{color:var(--accent)}
.st-locked .stxt b{color:var(--muted)}
.sbody{padding:0 16px 16px;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.round{border-top:1px solid var(--line);padding:12px 0}
.rhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rhead small{margin-left:auto}
.tag{font-size:.72rem;font-weight:650;padding:2px 10px;border-radius:999px;white-space:nowrap}
.tag.g{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.tag.a{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
.tag.b{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.tag.r{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.tag.y{background:var(--gold-l);color:var(--gold-ink)}
.rfiles{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px}
.note{background:var(--fill);border-radius:12px;padding:10px 14px;margin-top:8px}
.note p{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.9375rem}
details summary{cursor:pointer;color:var(--accent);font-size:.875rem;padding:6px 0}
.drop{display:flex;flex-direction:column;align-items:center;gap:2px;border:1.5px dashed color-mix(in srgb,var(--accent) 45%,var(--line));border-radius:14px;padding:20px;margin-top:10px;cursor:pointer;text-align:center;transition:background .15s,border-color .15s}
.drop:hover{background:color-mix(in srgb,var(--accent) 7%,transparent);border-color:var(--accent)}
.drop b{color:var(--accent)}
.banner{border-radius:14px;padding:14px 16px;margin-top:10px;background:color-mix(in srgb,var(--green) 11%,transparent);border:1px solid color-mix(in srgb,var(--green) 25%,transparent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{flex:1}
hr.s{border:0;border-top:1px solid var(--line);margin:16px 0}

/* admin dashboard */
.sbar{display:flex;height:12px;border-radius:7px;overflow:hidden;background:var(--fill);margin-top:12px}
.sbar i{display:block;height:100%;transform-origin:left;animation:jgrow .7s cubic-bezier(.2,.7,.2,1) both}
.leg{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:.84rem}
.leg span{display:inline-flex;align-items:center;gap:7px}
.leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.leg b{font-variant-numeric:tabular-nums}
.pn{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;margin-top:16px}
.pn h3{font-size:1rem}.pn>small{display:block;margin-top:2px}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
@media(max-width:820px){.two{grid-template-columns:1fr}}
.hr{display:grid;grid-template-columns:86px 1fr 30px;gap:10px;align-items:center;margin-top:10px;font-size:.88rem}
.hr .ht{height:10px;border-radius:6px;background:var(--fill);overflow:hidden}
.hr .ht i{display:block;height:100%;border-radius:6px;background:var(--accent);position:relative;overflow:hidden;transform-origin:left;animation:jgrow .7s cubic-bezier(.2,.7,.2,1) both}
.hr .ht u{position:absolute;left:0;top:0;bottom:0;background:var(--green);text-decoration:none}
.hr .hv{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:22px}
.tools .inp{margin:0;flex:1;min-width:200px}
.rows{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden}
.rw{display:grid;grid-template-columns:44px minmax(0,1.5fr) minmax(120px,1fr) auto;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 18px;cursor:pointer;transition:background .15s}
.rw:first-child{border-top:0}
.rw:hover{background:var(--fill)}
.rw .nm{min-width:0}.rw .nm b{display:block;overflow-wrap:anywhere;font-weight:600}
.rw .pr small{display:flex;justify-content:space-between;gap:8px}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.rw.fin .bar i{background:var(--green)}
@media(max-width:700px){.rw{grid-template-columns:44px 1fr;row-gap:8px}.rw .pr{grid-column:1/-1}.rw .tg{grid-column:1/-1}}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--amber);display:inline-block;margin-right:6px;animation:pl 1.6s ease-in-out infinite}
@keyframes pl{50%{opacity:.35;transform:scale(.8)}}
.ai{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.ai .sum{white-space:pre-wrap;font-size:.9rem;margin:6px 0 0}
.mk{display:grid;place-items:center;text-align:center;padding:40px 20px}
.mk .big{font-size:3rem}

/* library */
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}
.bk{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--sp,var(--accent));border-radius:6px 14px 14px 6px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:transform .18s,box-shadow .18s}
.bk:hover{transform:translateY(-2px)}
.bk .kd{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:600}
.bk .kd b{color:var(--sp,var(--accent));font-weight:700}
.bk h3{font-family:var(--serif);font-size:1.04rem;line-height:1.32;font-weight:600;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.bk .au{font-size:.86rem;color:var(--muted)}
.bk .ft{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:6px;gap:8px}
.bk .yr{font-family:var(--serif);font-size:1.3rem;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* feedback */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(.2,.8,.2,1);z-index:60;max-width:92vw;font-size:.9rem;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}.toast.err{background:var(--red)}
.busy{position:fixed;inset:0;z-index:50;background:rgba(7,16,31,.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center}
.busy[hidden]{display:none}
.busy div{background:var(--card);padding:22px 28px;border-radius:18px;text-align:center;box-shadow:var(--shadow);max-width:80vw}
.spin{width:28px;height:28px;border:3px solid var(--fill);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}

/* bottom bar (mobile) */
.tabbar{display:none}
@media(max-width:700px){
  .nav,header.top .btn.ghost,.uchip span{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--glass);backdrop-filter:blur(18px) saturate(170%);-webkit-backdrop-filter:blur(18px) saturate(170%);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--muted);font-size:.7rem;font-weight:600;cursor:pointer;border-radius:10px}
  .tabbar button svg{width:22px;height:22px}
  .tabbar button.on{color:var(--accent)}
}

/* viewer + manual notes */
.vw{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.vw[hidden]{display:none}
.vw .vh{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid var(--line);flex-wrap:wrap}
.vw .vt{flex:1;min-width:140px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vw .vb{flex:1;display:flex;min-height:0}
.vw .vdoc{flex:1;overflow:auto;background:#cfd6e2;padding:12px;min-width:0}
.vw .vdoc .docx-wrapper{background:transparent!important;padding:0!important}
.vw .vdoc .docx-wrapper>section.docx{margin:0 auto 12px!important;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.vw .vside{width:340px;max-width:42%;overflow:auto;border-left:1px solid var(--line);padding:14px;background:var(--card)}
.vw .vmsg{padding:40px 20px;text-align:center;color:#444}
.mn{display:flex;gap:8px;align-items:flex-start;background:var(--fill);border-radius:12px;padding:8px 10px;margin-top:6px;font-size:.9rem}
.mn .tx{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.mn button{background:none;border:0;color:var(--red);cursor:pointer;padding:2px 6px;font-size:1rem}
@media(max-width:760px){.vw .vb{flex-direction:column}.vw .vside{width:auto;max-width:none;max-height:42%;border-left:0;border-top:1px solid var(--line)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:opacity .2s!important}.btn:active,.bk:hover{transform:none}}
@media(prefers-reduced-transparency:reduce){header.top,.tabbar{background:var(--card);backdrop-filter:none}.busy{backdrop-filter:none}}
@media(prefers-contrast:more){.card,.stage,.pn,.rows,.strip,.bk{border-color:var(--text)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="viewer" class="vw" hidden role="dialog" aria-modal="true" aria-label="Penampil naskah"></div>
<div id="busy" class="busy" hidden><div><div class="spin"></div><span id="busyMsg">Memproses…</span></div></div>

<script>
/* ======================= KONFIGURASI (isi 2 nilai ini) ======================= */
var CONFIG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwvCglJ-tiUGfw49DyFuX3BY0mSK0sp1DololyWmev4Tffo8iCq3ZMYhDdoaRMhxbbgzA/exec',         // berakhiran /exec
  FIREBASE_API_KEY: 'AIzaSyDlFqbhYMg4wX6uClPIglsoTG24Yf2CvnU'    // Firebase project bimbingan-kti
};
/* ============================================================================= */

var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
var fmt = function (i) { try { return new Date(i).toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
var mem = {};
var store = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] == null ? null : mem[k]; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } }
};

var S = { view: 'boot', tab: 'login', auth: null, me: null, list: null, detail: null, lib: null, cap: null,
          open: {}, flt: 'all', q: '', libq: '', pendingEmail: '', lf: { j: 'all', k: 'all', s: 'new' }, _pv: '' };

var IC = {
  check: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 7v5l3 2"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8.5 15.5l.6-2.6 5.6-5.6 2 2-5.6 5.6z"/></svg>',
  dot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/></svg>'
};
var STATE = {
  accepted: ['check', 'Diterima'], submitted: ['clock', 'Menunggu review dosen'], revision: ['edit', 'Perlu revisi'],
  open: ['dot', 'Silakan unggah dokumen'], locked: ['lock', 'Terkunci']
};

/* ------------------------------ UI utilities ------------------------------ */
var toastT;
function toast(m, kind) {
  var t = $('#toast'); t.textContent = m; t.className = 'toast on' + (kind === 'err' ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(function () { t.className = 'toast'; }, kind === 'err' ? 5000 : 2800);
}
function busy(msg) { $('#busyMsg').textContent = msg || 'Memproses…'; $('#busy').hidden = false; }
function unbusy() { $('#busy').hidden = true; }
function toB64(file) {
  return new Promise(function (res, rej) {
    var r = new FileReader();
    r.onload = function () { res(String(r.result).split(',')[1]); };
    r.onerror = function () { rej(new Error('Gagal membaca berkas.')); };
    r.readAsDataURL(file);
  });
}
function download(d) {
  var bin = atob(d.b64), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([a], { type: d.mime })), l = document.createElement('a');
  l.href = url; l.download = d.name; document.body.appendChild(l); l.click(); l.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

/* ------------------------------ Firebase REST + API ------------------------------ */
function fbMsg(m) {
  m = String(m || '');
  if (/INVALID_LOGIN_CREDENTIALS|INVALID_PASSWORD|EMAIL_NOT_FOUND/.test(m)) return 'Email atau password salah.';
  if (/TOO_MANY_ATTEMPTS/.test(m)) return 'Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
  if (/USER_DISABLED/.test(m)) return 'Akun dinonaktifkan.';
  var code = (m.match(/[A-Z][A-Z_]{4,}/) || [''])[0];
  if (/OPERATION_NOT_ALLOWED/.test(m)) return 'Login Email/Password belum diaktifkan di Firebase (Authentication > Sign-in method).';
  if (/API_KEY|API key|PERMISSION_DENIED|referer/i.test(m)) return 'Kunci Firebase ditolak. Periksa FIREBASE_API_KEY dan pembatasan kuncinya. [' + (code || m.slice(0, 60)) + ']';
  return 'Gagal terhubung ke Firebase. [' + (code || m.slice(0, 80) || 'tanpa kode') + ']';
}
async function fb(path, body) {
  var r = await fetch('https://identitytoolkit.googleapis.com/v1/' + path + '?key=' + CONFIG.FIREBASE_API_KEY,
    { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  var j = await r.json();
  if (!r.ok) throw new Error(fbMsg(j.error && j.error.message));
  return j;
}
function saveAuth(j) {
  S.auth = { idToken: j.idToken || j.id_token, refreshToken: j.refreshToken || j.refresh_token,
             exp: Date.now() + (+(j.expiresIn || j.expires_in)) * 1000 };
  store.set('bka_rt', S.auth.refreshToken);
}
function authErr() { var e = new Error('Sesi berakhir. Silakan masuk kembali.'); e.code = 'AUTH'; return e; }
async function ensureToken() {
  if (!S.auth) throw authErr();
  if (S.auth.idToken && Date.now() < S.auth.exp - 120000) return;
  var r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + CONFIG.FIREBASE_API_KEY,
    { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(S.auth.refreshToken) });
  var j = await r.json();
  if (!r.ok) throw authErr();
  saveAuth(j);
}
async function api(action, data, anon) {
  var body = Object.assign({ action: action }, data || {});
  if (!anon) { await ensureToken(); body.idToken = S.auth.idToken; }
  var r, j;
  try { r = await fetch(CONFIG.GAS_URL, { method: 'POST', body: JSON.stringify(body) }); } // text/plain: tanpa preflight CORS
  catch (e) { throw new Error('Tidak dapat menghubungi server. Periksa GAS_URL dan pastikan Web App di-deploy dengan akses "Anyone".'); }
  try { j = await r.json(); }
  catch (e) { throw new Error('Server mengirim respons tak terduga (kode ' + r.status + '). Deploy ulang Web App sebagai versi baru dengan akses "Anyone".'); }
  if (!j.ok) { var e = new Error(j.error || 'Gagal.'); e.code = j.code; throw e; }
  return j.data;
}
function clearAuth() { S.auth = null; S.me = null; S.list = null; S.detail = null; S.lib = null; store.del('bka_rt'); }
function logout(msg) { clearAuth(); S.view = 'auth'; S.tab = 'login'; render(); if (msg) toast(msg); }

async function loadMe() {
  try {
    var d = await api('me');
    S.me = d;
    if (d.role === 'admin') { S.view = 'adminList'; await loadList(); } else S.view = 'student';
  } catch (e) {
    if (e.code === 'UNVERIFIED') S.view = 'unverified';
    else if (e.code === 'CLOSED') { clearAuth(); S.view = 'closed'; }
    else throw e;
  }
}
async function loadList() { S.list = await api('adminList'); }
async function loadDetail(id) { S.detail = await api('adminStudent', { userId: id }); S.detail.id = id; }
async function loadCaptcha() {
  S.cap = null; var el = $('#capq'); if (el) el.textContent = '…';
  try { S.cap = await api('captcha', {}, true); } catch (e) { S.cap = null; }
  el = $('#capq'); if (el) el.textContent = S.cap ? S.cap.q + ' = ?' : 'gagal memuat';
  var a = $('#capa'); if (a) a.value = '';
}

/* ------------------------------ Views ------------------------------ */
var CHK = '<svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.5 6.4l2.2 2.2 4.8-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SV = function (p) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; };
var ICO = {
  cap: SV('<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c0 1.2 2.7 3 6 3s6-1.8 6-3v-4.5"/><path d="M22 9v6"/>'),
  home: SV('<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>'),
  lib: SV('<path d="M4 4h5v16H4z"/><path d="M10 4h5v16h-5z"/><path d="M16.5 6l3.8 1-3.3 12.6-3.9-1"/>'),
  users: SV('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 5a3.5 3.5 0 010 6.5"/><path d="M18 14.8c2 .6 3.2 2.3 3.6 5.2"/>'),
  out: SV('<path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4"/><path d="M20 12H9"/>')
};
var JPLAY = false;

function ini(n) { var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function hue(s) { var h = 0; s = String(s || ''); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return h; }
function avatar(n, cls) { return '<span class="av ' + (cls || '') + '" style="--h:' + hue(n) + '">' + esc(ini(n)) + '</span>'; }
function today() { try { return new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); } catch (e) { return ''; } }

/* Titik-titik pada jalur bimbingan, diringkas dari daftar tahap */
function miles(stages) {
  var out = [], cur = null;
  stages.forEach(function (s) {
    var acc = !!s.crucial, lab;
    if (acc) lab = /Proposal|Seminar/i.test(s.label) ? 'ACC Sempro' : /Sidang/i.test(s.label) ? 'ACC Sidang' : 'ACC Submit';
    else if (s.group === 'Awal') lab = 'Judul';
    else if (s.group === 'Bagian Artikel') lab = 'Naskah';
    else lab = s.group;
    if (!cur || cur.label !== lab) { cur = { label: lab, done: 0, total: 0, acc: acc, state: '' }; out.push(cur); }
    cur.total++; if (s.state === 'accepted') cur.done++;
  });
  var found = false;
  out.forEach(function (m) { if (m.done === m.total) m.state = 'done'; else if (!found) { m.state = 'cur'; found = true; } else m.state = 'todo'; });
  return out;
}
function jalur(ms) {
  return '<div class="jlw"><ol class="jl on-dark' + (JPLAY ? ' play' : '') + '">' + ms.map(function (m, i) {
    return '<li class="jn ' + m.state + (m.acc ? ' acc' : '') + '" style="--i:' + i + '"><span class="jd">' + (m.state === 'done' ? CHK : '') + '</span><b>' + esc(m.label) + '</b>' +
      (m.total > 1 && m.state !== 'todo' ? '<small>' + m.done + '/' + m.total + '</small>' : '') + '</li>';
  }).join('') + '</ol></div>';
}

function nav(v, label) {
  var on = S.view === v || (v === 'adminList' && S.view === 'adminDetail');
  return '<button class="' + (on ? 'on' : '') + '" data-act="go" data-v="' + v + '">' + label + '</button>';
}
function header() {
  var adm = S.me && S.me.role === 'admin', stu = S.me && S.me.role === 'student', items = '', chip = '';
  if (stu) items = nav('student', 'Dashboard') + nav('lib', 'Perpustakaan');
  if (adm) items = nav('adminList', 'Mahasiswa') + nav('lib', 'Perpustakaan');
  if (S.me) { var nm = stu ? S.me.profile.nama : S.me.config.adminName; chip = '<div class="uchip">' + avatar(nm) + '<span>' + esc(stu ? nm.split(' ')[0] : 'Dosen pembimbing') + '</span></div>'; }
  return '<header class="top"><div class="in"><div class="brand"><span class="lg">' + ICO.cap + '</span><span class="bt"><b>Bimbingan karya ilmiah</b><small>' +
    (S.me ? 'Pembimbing: ' + esc(S.me.config.adminName) : 'Universitas Muhammadiyah Bengkulu') + '</small></span></div>' +
    '<nav class="nav">' + items + '</nav>' + chip + (S.auth ? '<button class="btn sm ghost" data-act="logout">Keluar</button>' : '') + '</div></header>';
}
function tabbar() {
  if (!S.me) return '';
  var stu = S.me.role === 'student', it = stu ? [['student', 'Dashboard', ICO.home], ['lib', 'Perpustakaan', ICO.lib]] : [['adminList', 'Mahasiswa', ICO.users], ['lib', 'Perpustakaan', ICO.lib]];
  return '<nav class="tabbar">' + it.map(function (x) {
    var on = S.view === x[0] || (x[0] === 'adminList' && S.view === 'adminDetail');
    return '<button class="' + (on ? 'on' : '') + '" data-act="go" data-v="' + x[0] + '">' + x[2] + '<span>' + x[1] + '</span></button>';
  }).join('') + '<button data-act="logout">' + ICO.out + '<span>Keluar</span></button></nav>';
}
function render() {
  var v = S.view, h = '';
  JPLAY = (S._pv !== v); S._pv = v;
  if (v === 'boot') h = '<div class="mk"><div class="spin"></div></div>';
  else if (v === 'auth') h = authView();
  else if (v === 'registered') h = msgView('✉️', 'Cek email Anda', 'Kami mengirim tautan verifikasi ke <b>' + esc(S.pendingEmail) + '</b>. Klik tautan tersebut (periksa juga folder spam), lalu kembali ke sini untuk masuk.',
    '<button class="btn primary" data-act="toLogin">Ke halaman masuk</button> <button class="btn" data-act="resend">Kirim ulang email</button>');
  else if (v === 'unverified') h = msgView('✉️', 'Email belum diverifikasi', 'Klik tautan verifikasi yang kami kirim ke email Anda, lalu coba masuk lagi.',
    '<button class="btn primary" data-act="resend">Kirim ulang tautan</button> <button class="btn" data-act="logout">Kembali</button>');
  else if (v === 'closed') h = msgView('🎓', 'Akses telah ditutup', 'Seluruh tahapan bimbingan karya ilmiah untuk akun ini telah selesai. Terima kasih dan semoga ilmunya bermanfaat.', '<button class="btn" data-act="toLogin">Kembali</button>');
  else if (v === 'student') h = studentView();
  else if (v === 'lib') h = libView();
  else if (v === 'adminList') h = adminListView();
  else if (v === 'adminDetail') h = adminDetailView();
  $('#app').innerHTML = header() + '<main class="wrap">' + h + '</main>' + tabbar();
  if (v === 'auth' && S.tab === 'register') loadCaptcha();
}
function msgView(icon, t, p, btns) {
  return '<div class="card mk" style="margin-top:40px"><div class="big">' + icon + '</div><h2 style="margin:8px 0">' + t + '</h2><p class="muted" style="max-width:420px">' + p + '</p><div class="row" style="justify-content:center;margin-top:10px">' + btns + '</div></div>';
}

function authView() {
  var seg = '<div class="seg"><button class="' + (S.tab === 'login' ? 'on' : '') + '" data-act="tab" data-t="login">Masuk</button><button class="' + (S.tab === 'register' ? 'on' : '') + '" data-act="tab" data-t="register">Daftar</button></div>';
  var tick = '<i>' + CHK + '</i>';
  var side = '<aside class="ap"><span class="lg">' + ICO.cap + '</span><h1>Bimbingan skripsi, tesis, dan artikel</h1>' +
    '<p>Ajukan naskah tahap demi tahap, terima catatan pembimbing, dan lihat sejauh mana karya Anda berjalan.</p>' +
    '<ol><li>' + tick + '<span>Unggah naskah DOCX pada setiap tahap, dari pengajuan judul sampai sidang.</span></li>' +
    '<li>' + tick + '<span>Catatan revisi menjelaskan apa yang diperbaiki, mengapa, dan bagaimana caranya.</span></li>' +
    '<li>' + tick + '<span>Karya yang selesai masuk perpustakaan sebagai rujukan.</span></li></ol></aside>';
  var form;
  if (S.tab === 'login') form = '<form class="card" data-form="login">' + seg +
    '<h2 style="margin:16px 0 0">Masuk ke akun Anda</h2>' +
    '<label class="f">Email<input class="inp" name="email" type="email" autocomplete="username" required></label>' +
    '<label class="f">Password<input class="inp" name="password" type="password" autocomplete="current-password" required></label>' +
    '<button class="btn primary block" style="margin-top:18px">Masuk</button>' +
    '<p style="text-align:center;margin:14px 0 0"><button type="button" class="lnk" data-act="forgot">Lupa password?</button></p></form>';
  else form = '<form class="card" data-form="register" autocomplete="on">' + seg +
    '<h2 style="margin:16px 0 0">Buat akun bimbingan</h2>' +
    '<label class="f">Nama lengkap<input class="inp" name="nama" required minlength="3" maxlength="100" autocomplete="name"></label>' +

function timeline(stages, admin) {
  var cur = stages.filter(function (s) { return s.state === 'open' || s.state === 'revision' || s.state === 'submitted'; })[0];
  var h = '', lg = '';
  stages.forEach(function (s) {
    if (s.group !== lg) { h += '<div class="grp">' + esc(s.group) + '</div>'; lg = s.group; }
    var isOpen = S.open[s.key] !== undefined ? S.open[s.key] : !!(cur && cur.key === s.key);
    var st = STATE[s.state];
    var body = '';
    if (s.hint && (s.state === 'open' || s.state === 'revision') && !admin) body += '<p class="muted" style="margin:0 0 6px;font-size:.9rem">' + esc(s.hint) + '</p>';
    if (s.state === 'locked') body += '<p class="muted" style="margin:0">Selesaikan tahap sebelumnya untuk membuka tahap ini.</p>';
    if (s.state === 'accepted' && s.rounds.length > 1) {
      body += '<details><summary>Riwayat revisi tahap ini (' + (s.rounds.length - 1) + ' revisi sebelum diterima)</summary>' + s.rounds.map(function (r) { return roundHtml(r, admin); }).join('') + '</details>';
    } else body += s.rounds.map(function (r) { return roundHtml(r, admin); }).join('');
    if (!admin && (s.state === 'open' || s.state === 'revision'))
      body += '<label class="drop"><input type="file" accept=".docx" hidden data-chg="pick" data-key="' + s.key + '"><b>' + (s.state === 'revision' ? 'Unggah revisi (DOCX)' : 'Pilih berkas DOCX') + '</b><small>Maksimal ' + S.me.config.maxMb + ' MB</small></label>';
    if (!admin && s.state === 'submitted') {
      var last = s.rounds[s.rounds.length - 1];
      body += '<div class="banner"><b>Dokumen terkirim.</b><p class="muted" style="margin:4px 0 10px;font-size:.9rem">Kabari dosen agar segera diperiksa.</p>' +
        '<a class="btn wa" target="_blank" rel="noopener" href="' + waLink(s, last.version) + '">Kirim WhatsApp ke dosen</a></div>';
    }
    if (admin && s.state === 'submitted') body += adminPanel(s, s.rounds[s.rounds.length - 1]);
    h += '<div class="stage st-' + s.state + (s.crucial ? ' crucial' : '') + (isOpen ? ' openb' : '') + '" data-k="' + s.key + '">' +
      '<button class="srow" data-act="toggle" data-key="' + s.key + '" aria-expanded="' + isOpen + '"><span class="sic">' + IC[st[0]] + '</span>' +
      '<span class="stxt"><b>' + esc(s.label) + '</b><small>' + st[1] + (s.rounds.length ? ' · ' + s.rounds.length + ' pengajuan' : '') + '</small></span><span class="chev">›</span></button>' +
      (isOpen ? '<div class="sbody">' + body + '</div>' : '') + '</div>';
  });
  return h;
}

function waLink(stage, version) {
  var p = S.me.profile, t = 'Assalamualaikum Pak, saya ' + p.nama + ' mahasiswa bimbingan bapak dengan judul ' + p.jenis.toLowerCase() + ' "' + p.judul + '". Mengirimkan ' +
    (version > 1 ? 'revisi ke ' : 'pengajuan ') + stage.label + '. Mohon dicek.';
  return 'https://wa.me/' + S.me.config.adminWa + '?text=' + encodeURIComponent(t);
}



/* ------------------------------ Dosen ------------------------------ */


function adminPanel(s, rd) {
  var ai = rd.ai, id = rd.id, st = rd.aiStatus || '';
  var draft = store.get('draft_' + id), text = draft != null ? draft : (ai ? ai.catatan_untuk_mahasiswa : '');
  var stx = { pending: 'Dalam antrean, diperiksa otomatis (±5 menit)', processing: 'Sedang diperiksa…', done: 'Selesai ' + fmt(rd.aiAt), error: 'Gagal: ' + esc(rd.aiError) }[st] || 'Belum diperiksa';
  var a = '<div class="ai"><div class="row"><b>Pemeriksaan Claude</b>' + (ai ? '<span class="tag ' + (ai.rekomendasi === 'lanjut' ? 'g' : 'a') + '">' + (ai.rekomendasi === 'lanjut' ? 'Rekomendasi: lanjut' : 'Rekomendasi: revisi') + '</span>' : '') + '<small class="sp"></small></div>' +
    '<small>' + stx + '</small>' + (ai ? '<p class="sum">' + esc(ai.ringkasan) + '</p>' : '') +
    '<div class="row" style="margin-top:10px">' + (rd.hasAiPdf ? '<button class="btn sm" data-act="dl" data-kind="ai" data-id="' + id + '">Lihat PDF hasil</button>' : '') +
    '<button class="btn sm" data-act="ai" data-id="' + id + '">' + (st === 'done' ? 'Periksa ulang' : st === 'error' ? 'Coba lagi' : 'Periksa sekarang') + '</button></div></div>';
  var isJudul = s.key === 'judul';
  return '<div style="margin-top:6px">' + a +
    '<div class="ai"><div class="row"><b>Catatan manual dosen</b><small class="sp"></small><button class="btn sm" data-act="view" data-id="' + id + '" data-name="' + esc(rd.fileName) + '">Baca naskah dan catat</button></div>' +
    '<small>Temuan Anda sendiri yang tidak tertangkap pemeriksaan otomatis. Dapat juga dicatat saat membaca naskah.</small>' + mnListHtml(id) +
    '<div class="grid2"><label class="f">Bagian / lokasi<input class="inp" id="mnl-' + id + '" maxlength="120" placeholder="mis. 1.2 paragraf 3"></label>' +
    '<label class="f">Temuan dan arahan<input class="inp" id="mnt-' + id + '" maxlength="1000" placeholder="masalah, alasan, cara memperbaiki"></label></div>' +
    '<div class="row" style="margin-top:10px"><button class="btn sm" data-act="mnAdd" data-id="' + id + '">+ Tambah catatan</button>' +
    '<button class="btn sm primary" data-act="mnInsert" data-id="' + id + '">Sisipkan ke surat</button></div></div>' +
    '<label class="f">Surat catatan untuk mahasiswa (dapat diedit bebas sebelum dikirim)<textarea class="inp" id="note-' + id + '" data-draft="' + id + '" placeholder="Tulis catatan revisi sendiri, atau muat draf Claude lalu sesuaikan…">' + esc(text) + '</textarea></label>' +
    (ai ? '<div class="row" style="margin-top:6px"><button class="btn sm" data-act="loadAi" data-id="' + id + '">Muat ulang draf Claude</button><button class="btn sm" data-act="clearNote" data-id="' + id + '">Kosongkan, tulis sendiri</button></div>' : '') +
    '<label class="f">Lampirkan berkas dari dosen (opsional, DOCX/PDF)<input class="inp" type="file" id="lec-' + id + '" accept=".docx,.pdf"></label>' +
    (isJudul ? '<label class="f">Judul final jika diterima (opsional)<input class="inp" id="title-' + id + '" maxlength="300" value="' + esc(S.detail.profile.judul) + '"></label>' : '') +
    '<label class="f">Catatan penutup tahap jika diterima (opsional)<input class="inp" id="close-' + id + '" maxlength="500" placeholder="mis. seluruh catatan revisi telah ditindaklanjuti"></label>' +
    '<label class="f" style="display:flex;gap:8px;align-items:center;color:var(--text)"><input type="checkbox" id="inc-' + id + '" ' + (ai && ai.rekomendasi === 'lanjut' ? 'checked' : '') + '> Sertakan catatan di atas pada email penerimaan</label>' +
    '<div class="row" style="margin-top:14px"><button class="btn warn sp" data-act="decide" data-dec="revisi" data-id="' + id + '">Kirim sebagai Revisi</button><button class="btn good sp" data-act="decide" data-dec="diterima" data-id="' + id + '">Terima dan lanjut</button></div></div>';
}

/* ------------------------------ Catatan manual & penampil DOCX ------------------------------ */
function mnGet(id) { try { return JSON.parse(store.get('mn_' + id) || '[]'); } catch (e) { return []; } }
function mnSet(id, a) { store.set('mn_' + id, JSON.stringify(a)); }
function mnListHtml(id) {
  return mnGet(id).map(function (n, i) {
    return '<div class="mn"><div class="tx">' + (n.loc ? '<b>' + esc(n.loc) + '</b>: ' : '') + esc(n.text) + '</div><button data-act="mnDel" data-id="' + id + '" data-i="' + i + '" aria-label="Hapus">✕</button></div>';
  }).join('');
}
function mnAddNote(id, loc, text) {
  text = String(text || '').trim(); if (!text) return false;
  var a = mnGet(id); a.push({ loc: String(loc || '').trim(), text: text }); mnSet(id, a); return true;
}
function loadScript(src) {
  return new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = src; s.onload = res;
    s.onerror = function () { rej(new Error('Gagal memuat penampil dokumen. Periksa koneksi, atau unduh berkasnya.')); };
    document.head.appendChild(s);
  });
}
async function ensureDocx() {
  if (window.docx) return;
  if (!window.JSZip) await loadScript('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');
  await loadScript('https://cdn.jsdelivr.net/npm/docx-preview@0.3.5/dist/docx-preview.min.js');
}
function b64ToBuf(b64) {
  var bin = atob(b64), a = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
  return a.buffer;
}
var VW = { id: null, zoom: 1, fit: true };
function vwApplyZoom() {
  var w = $('#vdoc .docx-wrapper'), sec = $('#vdoc section.docx'); if (!w || !sec) return;
  var z = VW.zoom;
  if (VW.fit) { var avail = $('#vdoc').clientWidth - 24, pw = sec.offsetWidth || 794; z = Math.min(1.5, Math.max(.3, avail / pw)); VW.zoom = z; }
  w.style.zoom = z;
  var zl = $('#vzl'); if (zl) zl.textContent = Math.round(z * 100) + '%';
}
function vwSide() {
  var el = $('#vside'); if (!el) return;
  el.innerHTML = '<b>Catatan manual</b><p class="muted" style="margin:4px 0 0;font-size:.85rem">Catat temuan sambil membaca. Tersimpan otomatis, lalu disisipkan ke surat dari panel keputusan.</p>' +
    mnListHtml(VW.id).replace(/data-act="mnDel"/g, 'data-act="mnDel" data-v="1"') +
    '<label class="f">Bagian / lokasi<input class="inp" id="vl" maxlength="120" placeholder="mis. 2.1 paragraf 2"></label>' +
    '<label class="f">Temuan dan arahan<textarea class="inp" id="vt2" maxlength="1000" style="min-height:90px" placeholder="masalah, alasan, cara memperbaiki"></textarea></label>' +
    '<button class="btn primary block" style="margin-top:10px" data-act="vwAdd">+ Tambah catatan</button>';
}
async function openViewer(id, name) {
  VW = { id: id, zoom: 1, fit: true };
  var v = $('#viewer'); v.hidden = false; document.body.style.overflow = 'hidden';
  v.innerHTML = '<div class="vh"><button class="btn sm" data-act="vwClose">‹ Tutup</button><div class="vt">' + esc(name) + '</div>' +
    '<button class="btn sm" data-act="vwZ" data-d="-1" aria-label="Perkecil">−</button><small id="vzl" style="min-width:42px;text-align:center">100%</small><button class="btn sm" data-act="vwZ" data-d="1" aria-label="Perbesar">+</button><button class="btn sm" data-act="vwFit">Pas lebar</button>' +
    '<button class="btn sm" data-act="dl" data-kind="sub" data-id="' + id + '">⬇ Unduh</button></div>' +
    '<div class="vb"><div class="vdoc" id="vdoc"><div class="vmsg"><div class="spin"></div>Memuat naskah…</div></div><aside class="vside" id="vside"></aside></div>';
  vwSide();
  try {
    var d = await api('getFile', { kind: 'sub', id: id });
    await ensureDocx();
    var box = $('#vdoc'); box.innerHTML = '';
    await window.docx.renderAsync(b64ToBuf(d.b64), box, null, { className: 'docx', inWrapper: true, ignoreWidth: false, breakPages: true, useBase64URL: true });
    vwApplyZoom();
  } catch (e) {
    if (e.code === 'AUTH') { closeViewer(); logout(e.message); return; }
    var b = $('#vdoc'); if (b) b.innerHTML = '<div class="vmsg">Naskah tidak dapat ditampilkan: ' + esc(e.message || 'kesalahan') + '<br>Gunakan tombol Unduh untuk membukanya di Word.</div>';
  }
}
function closeViewer() { $('#viewer').hidden = true; $('#viewer').innerHTML = ''; document.body.style.overflow = ''; if (S.view === 'adminDetail') render(); }
window.addEventListener('resize', function () { if (!$('#viewer').hidden && VW.fit) vwApplyZoom(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('#viewer').hidden) closeViewer(); });

/* ------------------------------ Actions ------------------------------ */
async function guard(fn, msg) {
  try { if (msg) busy(msg); await fn(); }
  catch (e) { if (e.code === 'AUTH') logout(e.message); else toast(e.message, 'err'); }
  finally { unbusy(); }
}
async function refreshAfter(id) {
  if (S.view === 'adminDetail') { await loadDetail(S.detail.id); await loadList(); } else await loadMe();
  render();
}
var ACT = {
  go: async function (t) {
    var v = t.dataset.v; S.view = v;
    if (v === 'lib') { S.lib = null; render(); S.lib = await api('libraryList'); }
    if (v === 'adminList') await loadList();
    render();
  },
  logout: function () { logout(); },
  view: function (t) { return openViewer(t.dataset.id, t.dataset.name || 'Naskah'); },
  vwClose: function () { closeViewer(); },
  vwZ: function (t) { VW.fit = false; VW.zoom = Math.min(2, Math.max(.3, VW.zoom + (+t.dataset.d) * .1)); vwApplyZoom(); },
  vwFit: function () { VW.fit = true; vwApplyZoom(); },
  vwAdd: function () {
    if (!mnAddNote(VW.id, $('#vl').value, $('#vt2').value)) return toast('Tulis temuan terlebih dahulu.', 'err');
    vwSide(); toast('Catatan ditambahkan.');
  },
  mnAdd: function (t) {
    var id = t.dataset.id;
    if (!mnAddNote(id, $('#mnl-' + id).value, $('#mnt-' + id).value)) return toast('Tulis temuan terlebih dahulu.', 'err');
    var cur = $('#note-' + id).value; store.set('draft_' + id, cur); render();
  },
  mnDel: function (t) {
    var id = t.dataset.id, a = mnGet(id); a.splice(+t.dataset.i, 1); mnSet(id, a);
    if (t.dataset.v) vwSide(); else { store.set('draft_' + id, $('#note-' + id).value); render(); }
  },
  mnInsert: function (t) {
    var id = t.dataset.id, a = mnGet(id), ta = $('#note-' + id);
    if (!a.length) return toast('Belum ada catatan manual untuk disisipkan.', 'err');
    var block = 'Catatan tambahan dari pembimbing:\n' + a.map(function (n, i) { return (i + 1) + '. ' + (n.loc ? n.loc + ': ' : '') + n.text; }).join('\n');
    var cur = ta.value.replace(/\s+$/, ''), k = cur.lastIndexOf('Wassalamualaikum');
    var out = k > 0 ? cur.slice(0, k).replace(/\s+$/, '') + '\n\n' + block + '\n\n' + cur.slice(k) : (cur ? cur + '\n\n' : '') + block;
    store.set('draft_' + id, out); mnSet(id, []); render(); toast('Catatan manual disisipkan ke surat.');
  },
  loadAi: function (t) {
    var id = t.dataset.id, ta = $('#note-' + id), rd = null;
    S.detail.stages.forEach(function (s) { s.rounds.forEach(function (r) { if (r.id === id) rd = r; }); });
    if (!rd || !rd.ai) return;
    if (ta.value.trim() && !confirm('Ganti isi surat dengan draf Claude? Perubahan manual pada surat akan hilang.')) return;
    store.set('draft_' + id, rd.ai.catatan_untuk_mahasiswa); render();
  },
  clearNote: function (t) {
    var id = t.dataset.id;
    if ($('#note-' + id).value.trim() && !confirm('Kosongkan surat dan tulis sendiri dari awal?')) return;
    store.set('draft_' + id, ''); render();
  },
  toLogin: function () { S.view = 'auth'; S.tab = 'login'; render(); },
  tab: function (t) { S.tab = t.dataset.t; render(); },
  cap: function () { loadCaptcha(); },
  toggle: function (t) {
    var k = t.dataset.key, el = t.closest('.stage'), cur = el.classList.contains('openb');
    S.open[k] = !cur; render();
  },
  flt: function (t) { S.flt = t.dataset.f; render(); },
  libj: function (t) { S.lf.j = t.dataset.j; render(); },
  gotoStage: function (t) {
    S.open[t.dataset.key] = true; render();
    var el = document.querySelector('.stage[data-k="' + t.dataset.key + '"]');
    if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'center' });
  },
  back: async function () { S.view = 'adminList'; await loadList(); render(); },
  open: function (t) { return guard(async function () { await loadDetail(t.dataset.id); S.view = 'adminDetail'; S.open = {}; render(); window.scrollTo(0, 0); }, 'Membuka…'); },
  dl: function (t) { return guard(async function () { download(await api('getFile', { kind: t.dataset.kind, id: t.dataset.id })); }, 'Menyiapkan berkas…'); },
  verify: function (t) { return guard(async function () { await api('adminVerify', { userId: t.dataset.id }); await refreshAfter(); toast('Mahasiswa diverifikasi.'); }, 'Memproses…'); },
  ai: function (t) {
    return guard(async function () { store.del('draft_' + t.dataset.id); await api('aiReview', { submissionId: t.dataset.id }); await refreshAfter(); toast('Pemeriksaan selesai.'); },
      'Claude sedang memeriksa naskah. Biasanya 30 detik sampai 2 menit.');
  },
  decide: function (t) {
    var id = t.dataset.id, dec = t.dataset.dec, note = $('#note-' + id).value.trim(), nm = S.detail.profile.nama;
    if (dec === 'revisi' && note.length < 10 && !mnGet(id).length) return toast('Tulis catatan revisi terlebih dahulu.', 'err');
    if (mnGet(id).length) { toast('Ada catatan manual yang belum disisipkan ke surat. Klik "Sisipkan ke surat" dahulu.', 'err'); return; }
    if (dec === 'revisi' && note.length < 10) return toast('Tulis catatan revisi terlebih dahulu.', 'err');
    if (!confirm(dec === 'revisi' ? 'Kirim catatan revisi ke ' + nm + '? Email akan terkirim otomatis.' : 'Terima tahap ini dan buka tahap berikutnya untuk ' + nm + '? Email akan terkirim otomatis.')) return;
    return guard(async function () {
      var f = $('#lec-' + id).files[0], lec = null;
      if (f) { if (f.size > S.me.config.maxMb * 1048576) throw new Error('Berkas lampiran terlalu besar.'); lec = { name: f.name, b64: await toB64(f) }; }
      var tt = $('#title-' + id), inc = $('#inc-' + id).checked;
      var r = await api('decide', { submissionId: id, decision: dec, note: dec === 'revisi' || inc ? note : '', closingNote: $('#close-' + id).value, newTitle: tt ? tt.value : '', lecturerFile: lec });
      store.del('draft_' + id); await refreshAfter();
      toast(r.mailed ? 'Terkirim dan email notifikasi dikirim.' : 'Tersimpan, tetapi email gagal dikirim (kuota?).', r.mailed ? '' : 'err');
    }, 'Mengirim…');
  },
  forgot: async function () {
    var em = (prompt('Masukkan email akun Anda:') || '').trim(); if (!em) return;
    try { await fb('accounts:sendOobCode', { requestType: 'PASSWORD_RESET', email: em }); } catch (e) {}
    toast('Jika email terdaftar, tautan reset password telah dikirim.');
  },
  resend: function () {
    var em = S.pendingEmail || (S.me && S.me.profile && S.me.profile.email) || (prompt('Masukkan email pendaftaran:') || '').trim(); if (!em) return;
    return guard(async function () { await api('resendVerify', { email: em }, true); toast('Jika email terdaftar dan belum diverifikasi, tautan baru telah dikirim.'); }, 'Mengirim…');
  }
};

var CHG = {
  libk: function (el) { S.lf.k = el.value; render(); },
  libs: function (el) { S.lf.s = el.value; render(); },
  jenjang: function (el) {
    var j = $('select[name=jenis]'), o = el.value === 'S1' ? ['Skripsi', 'Artikel'] : el.value === 'S2' ? ['Tesis', 'Artikel'] : [];
    j.disabled = !o.length; j.innerHTML = '<option value="">Pilih</option>' + o.map(function (x) { return '<option>' + x + '</option>'; }).join('');
  },
  pick: function (el) {
    var f = el.files[0], key = el.dataset.key; if (!f) return;
    if (!/\.docx$/i.test(f.name)) { el.value = ''; return toast('Format berkas harus DOCX.', 'err'); }
    if (f.size > S.me.config.maxMb * 1048576) { el.value = ''; return toast('Ukuran berkas melebihi ' + S.me.config.maxMb + ' MB.', 'err'); }
    var stage = S.me.stages.filter(function (s) { return s.key === key; })[0];
    if (!confirm('Kirim "' + f.name + '" untuk tahap ' + stage.label + '?')) { el.value = ''; return; }
    return guard(async function () {
      var r = await api('upload', { stageKey: key, fileName: f.name, b64: await toB64(f) });
      S.open[key] = true; await loadMe(); render(); toast('Dokumen terkirim. Klik tombol WhatsApp untuk mengabari dosen.');
    }, 'Mengunggah dokumen…');
  },
  final: function (el) {
    var f = el.files[0]; if (!f) return;
    if (!/\.(pdf|docx)$/i.test(f.name)) { el.value = ''; return toast('Format berkas harus PDF atau DOCX.', 'err'); }
    if (f.size > S.me.config.maxMb * 1048576) { el.value = ''; return toast('Ukuran berkas terlalu besar.', 'err'); }
    if (!confirm('Unggah berkas final? Setelah ini akses akun Anda akan ditutup dan tidak dapat dibuka kembali oleh Anda.')) { el.value = ''; return; }
    return guard(async function () {
      await api('finalUpload', { fileName: f.name, b64: await toB64(f), consentLibrary: $('#consentLib').checked });
      clearAuth(); S.view = 'closed'; render();
    }, 'Mengunggah berkas final…');
  }
};

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-act]'); if (!t) return;
  var fn = ACT[t.dataset.act]; if (!fn) return;
  Promise.resolve().then(function () { return fn(t, e); }).catch(function (err) { if (err.code === 'AUTH') logout(err.message); else toast(err.message, 'err'); });
});
document.addEventListener('change', function (e) {
  var t = e.target.closest('[data-chg]'); if (!t) return;
  var fn = CHG[t.dataset.chg]; if (fn) Promise.resolve().then(function () { return fn(t); }).catch(function (err) { toast(err.message, 'err'); });
});
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.dataset.draft) store.set('draft_' + t.dataset.draft, t.value);
  if (t.dataset.inp === 'q') { S.q = t.value; var p = t.selectionStart; render(); var n = $('[data-inp=q]'); n.focus(); n.setSelectionRange(p, p); }
  if (t.dataset.inp === 'libq') { S.libq = t.value; var p2 = t.selectionStart; render(); var n2 = $('[data-inp=libq]'); n2.focus(); n2.setSelectionRange(p2, p2); }
});
document.addEventListener('submit', function (e) {
  var f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault();
  var fd = Object.fromEntries(new FormData(f).entries());
  if (f.dataset.form === 'login') {
    guard(async function () {
      var j = await fb('accounts:signInWithPassword', { email: fd.email.trim(), password: fd.password, returnSecureToken: true });
      saveAuth(j); S.pendingEmail = fd.email.trim().toLowerCase(); await loadMe(); render();
    }, 'Masuk…');
  } else {
    if (fd.password !== fd.password2) return toast('Ulangi password tidak sama.', 'err');
    if (!S.cap) return toast('Soal verifikasi belum termuat. Klik tombol muat ulang.', 'err');
    guard(async function () {
      try {
        await api('register', Object.assign({}, fd, { consentAi: !!fd.consentAi, captchaToken: S.cap.token, captchaAnswer: $('#capa').value }), true);
      } catch (err) { loadCaptcha(); throw err; }
      S.pendingEmail = fd.email.trim().toLowerCase(); S.view = 'registered'; render();
    }, 'Membuat akun…');
  }
});

/* Segarkan otomatis status pemeriksaan di detail dosen (tidak saat sedang mengetik) */
setInterval(function () {
  if (S.view !== 'adminDetail' || !S.detail || document.hidden) return;
  var a = document.activeElement; if (a && /^(TEXTAREA|INPUT)$/.test(a.tagName)) return;
  var pend = S.detail.stages.some(function (s) { return s.rounds.some(function (r) { return r.aiStatus === 'pending' || r.aiStatus === 'processing'; }); });
  if (!pend) return;
  loadDetail(S.detail.id).then(function () { if (S.view === 'adminDetail') render(); }).catch(function () {});
}, 25000);

(async function boot() {
  if (/PASTE_/.test(CONFIG.GAS_URL + CONFIG.FIREBASE_API_KEY)) {
    $('#app').innerHTML = '<main class="wrap"><div class="card"><h2>Konfigurasi belum diisi</h2><p class="muted">Isi GAS_URL dan FIREBASE_API_KEY di bagian CONFIG pada index.html.</p></div></main>'; return;
  }
  var rt = store.get('bka_rt');
  if (rt) {
    S.auth = { idToken: '', refreshToken: rt, exp: 0 };
    try { await loadMe(); } catch (e) { clearAuth(); S.view = 'auth'; }
  } else S.view = 'auth';
  render();
})();
</script>
